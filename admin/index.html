<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portfolio Admin Dashboard</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div id="login-view" class="center-view">
    <form id="login-form" class="auth-card">
      <div class="eyebrow">SHIVAM SHARMA</div>
      <h1>Admin Login</h1>
      <p>Manage the portfolio content from one place.</p>
      <label>Email<input id="login-email" type="email" required autocomplete="username"></label>
      <label>Password<input id="login-password" type="password" required autocomplete="current-password"></label>
      <button type="submit">Sign in</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="dashboard-view" hidden>
    <header class="topbar">
      <div><strong>Portfolio Admin</strong><span id="admin-email"></span></div>
      <div class="top-actions"><a href="/" target="_blank" rel="noopener">View Portfolio</a><button id="logout">Logout</button></div>
    </header>
    <main class="dashboard">
      <div class="page-head"><div><div class="eyebrow">CONTENT MANAGEMENT</div><h1>Dashboard</h1><p>Update your portfolio without editing HTML files.</p></div><div id="save-status"></div></div>

      <section class="panel">
        <div class="panel-head"><h2>Profile & Contact</h2><button class="primary" id="save-site">Save changes</button></div>
        <form id="site-form" class="grid-form"></form>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Skills</h2><button class="primary" id="add-skill">Add skill</button></div>
        <div id="skills-list" class="cards"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Projects</h2><button class="primary" id="add-project">Add project</button></div>
        <div id="projects-list" class="cards"></div>
      </section>
    </main>
  </div>
  <script src="/admin/admin.js"></script>
</body>
</html>
